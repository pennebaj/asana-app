<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }
    body.dark { background: #141414; color: #e0e0e0; }

    /* ── Setup screen ── */
    #setup {
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .setup-card {
      background: #fff;
      border-radius: 10px;
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    body.dark .setup-card { background: #1e1e1e; box-shadow: 0 2px 12px rgba(0,0,0,0.4); }
    .setup-card h1 { font-size: 1.4rem; margin-bottom: 10px; }
    .setup-card p { font-size: 0.9rem; color: #555; margin-bottom: 20px; line-height: 1.5; }
    body.dark .setup-card p { color: #999; }
    .setup-card a { color: #4a90e2; }
    .setup-card input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      margin-bottom: 14px;
      font-family: monospace;
      background: #fff;
      color: #222;
    }
    body.dark .setup-card input { background: #2a2a2a; border-color: #444; color: #e0e0e0; }
    .setup-card input:focus { outline: none; border-color: #4a90e2; }
    .btn-primary {
      width: 100%;
      padding: 11px;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-primary:hover { background: #357abd; }
    .setup-error { color: #c0392b; font-size: 0.85rem; margin-top: 10px; }

    /* ── Main app ── */
    #app { display: none; max-width: 800px; min-width: 300px; margin: 0 auto; padding: 24px 12px; }

    .app-header {
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .app-header h1 { font-size: 1.3rem; }
    .header-actions {
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
    }
    .header-actions > * + * { margin-left: 16px; }
    .btn-refresh {
      padding: 6px 14px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      color: #444;
      transition: background 0.15s;
    }
    body.dark .btn-refresh { background: #2a2a2a; border-color: #444; color: #ccc; }
    .btn-refresh:hover { background: #f0f0f0; }
    body.dark .btn-refresh:hover { background: #333; }
    .btn-dark {
      padding: 6px 12px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      color: #444;
      line-height: 1;
      transition: background 0.15s;
    }
    body.dark .btn-dark { background: #2a2a2a; border-color: #444; color: #ccc; }
    .btn-dark:hover { background: #f0f0f0; }
    body.dark .btn-dark:hover { background: #333; }
    .btn-signout {
      padding: 6px 14px;
      background: none;
      border: none;
      font-size: 0.85rem;
      color: #888;
      cursor: pointer;
    }
    .btn-signout:hover { color: #c0392b; }

    /* ── Task list ── */
    #task-list { list-style: none; }

    .task-row {
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      background: #fff;
      border-radius: 8px;
      padding: 14px 20px;
      margin-bottom: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      transition: opacity 0.5s ease, transform 0.5s ease, margin-bottom 0.5s ease, padding 0.5s ease;
    }
    body.dark .task-row { background: #1e1e1e; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
    .task-row.new-day { margin-top: 18px; }
    .task-row.dragging { opacity: 0.35; }
    .task-row.drop-above { box-shadow: 0 -3px 0 #4a90e2, 0 1px 4px rgba(0,0,0,0.07); }
    .task-row.drop-below { box-shadow: 0 3px 0 #4a90e2, 0 1px 4px rgba(0,0,0,0.07); }
    body.dark .task-row.drop-above { box-shadow: 0 -3px 0 #4a90e2, 0 1px 4px rgba(0,0,0,0.3); }
    body.dark .task-row.drop-below { box-shadow: 0 3px 0 #4a90e2, 0 1px 4px rgba(0,0,0,0.3); }
    .task-row.fading {
      opacity: 0;
      transform: translateX(30px);
      margin-bottom: 0;
      padding-top: 0;
      padding-bottom: 0;
      pointer-events: none;
    }

    /* Table-based layout — CSS Level 2, works on all browsers including old Kindle.
       display:table-cell + vertical-align:middle gives automatic vertical centering
       regardless of whether the task name is one line or many. */
    .task-row-main {
      display: table;
      width: 100%;
      border-collapse: collapse;
    }

    /* Left cell: checkbox, and (in reorder mode) drag handle + up/down buttons */
    .task-left {
      display: table-cell;
      vertical-align: middle;
      white-space: nowrap;
      width: 1px;        /* shrink-wrap to content */
      padding-right: 20px;
    }

    /* Right cell: due date + snooze button */
    .task-right {
      display: table-cell;
      vertical-align: middle;
      white-space: nowrap;
      width: 1px;        /* shrink-wrap to content */
      padding-left: 8px;
    }

    /* Reorder button */
    .btn-reorder {
      padding: 6px 14px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      color: #444;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .btn-reorder.active { background: #4a90e2; color: #fff; border-color: #4a90e2; }
    body.dark .btn-reorder { background: #2a2a2a; border-color: #444; color: #ccc; }
    body.dark .btn-reorder.active { background: #4a90e2; border-color: #4a90e2; color: #fff; }

    /* Drag handle — hidden until reorder mode */
    .drag-handle {
      display: none;
      cursor: grab;
      color: #ccc;
      font-size: 1.05rem;
      line-height: 30px;
      margin-right: 6px;
      vertical-align: middle;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      letter-spacing: -1px;
    }
    .drag-handle:active { cursor: grabbing; }
    body.dark .drag-handle { color: #555; }
    #app.reorder-mode .drag-handle { display: inline-block; }

    /* Up / down buttons — hidden until reorder mode */
    .btn-move {
      display: none;
      width: 30px;
      height: 30px;
      background: #f0f4ff;
      border: 1px solid #c8d8f8;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      line-height: 28px;
      color: #4a90e2;
      font-size: 1rem;
      transition: background 0.15s;
      margin-left: 6px;
      vertical-align: middle;
    }
    .btn-move:hover { background: #d8e8ff; }
    body.dark .btn-move { background: #1a2540; border-color: #2a3f6f; }
    body.dark .btn-move:hover { background: #223060; }
    #app.reorder-mode .btn-move { display: inline-block; }
    #app.reorder-mode .btn-move + .task-check { margin-left: 10px; }

    /* Checkbox — inline-block so it sits in the table-cell flow;
       position:relative anchors the checkmark pseudo-element */
    .task-check {
      display: inline-block;
      vertical-align: middle;
      position: relative;
      width: 32px;
      height: 32px;
      border: 2px solid #bbb;
      border-radius: 7px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    body.dark .task-check { border-color: #555; }
    .task-check:hover { border-color: #4a90e2; }
    .task-check.checked { border-color: #27ae60; background: #27ae60; }
    .task-check.checked::after {
      content: '';
      position: absolute;
      display: block;
      width: 8px;
      height: 15px;
      border: 2.5px solid #fff;
      border-top: none;
      border-left: none;
      top: 50%;
      left: 50%;
      /* translate to center, then rotate to form the tick ✓ */
      -webkit-transform: translate(-50%, -55%) rotate(45deg);
      transform: translate(-50%, -55%) rotate(45deg);
    }

    /* Task name — table-cell naturally takes all remaining width */
    .task-name {
      display: table-cell;
      vertical-align: middle;
      font-size: 0.97rem;
      line-height: 1.4;
      word-break: break-word;
    }

    /* Due date */
    .task-due {
      display: inline-block;
      vertical-align: middle;
      font-size: 0.82rem;
      color: #777;
      white-space: nowrap;
      min-width: 54px;
      text-align: right;
      padding: 0 8px;
    }
    body.dark .task-due { color: #888; }
    .task-due.overdue { color: #c0392b; font-weight: 600; }
    .task-due.today   { color: #e67e22; font-weight: 600; }
    body.dark .task-due.overdue { color: #e74c3c; }
    body.dark .task-due.today   { color: #e67e22; }

    /* Snooze button — inline-block sits beside the due date;
       line-height centers the arrow icon vertically */
    .btn-snooze {
      display: inline-block;
      vertical-align: middle;
      width: 34px;
      height: 34px;
      background: #f0f4ff;
      border: 1px solid #c8d8f8;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      line-height: 34px;
      color: #4a90e2;
      font-size: 1.1rem;
      transition: background 0.15s;
      margin-left: 12px;
    }
    body.dark .btn-snooze { background: #1a2540; border-color: #2a3f6f; }
    .btn-snooze:hover { background: #d8e8ff; }
    body.dark .btn-snooze:hover { background: #223060; }
    .btn-snooze:disabled { opacity: 0.4; cursor: default; }

    /* Notes panel */
    .task-notes { overflow: hidden; max-height: 0; transition: max-height 0.3s ease; }
    .task-notes.open { max-height: 600px; }
    .task-notes-inner {
      padding-top: 12px;
      padding-left: 62px;
      font-size: 0.88rem;
      color: #555;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      cursor: pointer;
    }
    body.dark .task-notes-inner { color: #999; }

    /* Loading / empty / error states */
    .state-msg { text-align: center; padding: 48px 16px; color: #888; font-size: 0.95rem; }
    .state-msg.error { color: #c0392b; }
    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid #ddd;
      border-top-color: #4a90e2;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 12px;
    }
    body.dark .spinner { border-color: #333; border-top-color: #4a90e2; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- Setup screen -->
<div id="setup">
  <div class="setup-card">
    <h1>My Tasks</h1>
    <p>Enter your Asana Personal Access Token to get started.<br>
      Create one at <a href="https://app.asana.com/0/my-apps" target="_blank">app.asana.com/0/my-apps</a>.
      It's saved only in your browser.</p>
    <input type="password" id="pat-input" placeholder="Paste your token here" autocomplete="off">
    <button class="btn-primary" id="save-pat-btn">Connect to Asana</button>
    <div class="setup-error" id="setup-error"></div>
  </div>
</div>

<!-- Main app -->
<div id="app">
  <div class="app-header">
    <h1>My Tasks</h1>
    <div class="header-actions">
      <button class="btn-dark" id="dark-btn" title="Toggle dark mode">&#9790;</button>
      <button class="btn-reorder" id="reorder-btn">Reorder</button>
      <button class="btn-refresh" id="refresh-btn">&#8635; Refresh</button>
      <button class="btn-signout" id="signout-btn">Sign out</button>
    </div>
  </div>
  <ul id="task-list"></ul>
</div>

<script>
// ── Promise polyfill for older browsers (Kindle, etc.) ──
if (typeof Promise === 'undefined') {
  window.Promise = function (fn) {
    var self = this;
    self._s = 'pending'; self._v = undefined;
    self._ok = []; self._fail = [];
    function res(v) {
      if (self._s !== 'pending') return;
      self._s = 'resolved'; self._v = v;
      self._ok.forEach(function (f) { setTimeout(function () { f(v); }, 0); });
    }
    function rej(r) {
      if (self._s !== 'pending') return;
      self._s = 'rejected'; self._v = r;
      self._fail.forEach(function (f) { setTimeout(function () { f(r); }, 0); });
    }
    try { fn(res, rej); } catch (e) { rej(e); }
  };
  Promise.prototype.then = function (onOk, onFail) {
    var self = this;
    return new Promise(function (res, rej) {
      function go(fn, v) { try { res(fn ? fn(v) : v); } catch (e) { rej(e); } }
      function goFail(fn, v) { try { if (fn) res(fn(v)); else rej(v); } catch (e) { rej(e); } }
      if (self._s === 'resolved') setTimeout(function () { go(onOk, self._v); }, 0);
      else if (self._s === 'rejected') setTimeout(function () { goFail(onFail, self._v); }, 0);
      else { self._ok.push(function (v) { go(onOk, v); }); self._fail.push(function (v) { goFail(onFail, v); }); }
    });
  };
  Promise.prototype.catch = function (fn) { return this.then(undefined, fn); };
  Promise.all = function (ps) {
    return new Promise(function (res, rej) {
      var out = [], left = ps.length;
      if (!left) { res(out); return; }
      ps.forEach(function (p, i) {
        p.then(function (v) { out[i] = v; if (!--left) res(out); }, rej);
      });
    });
  };
}

(function () {
  'use strict';

  var API      = 'https://app.asana.com/api/1.0';
  var PROJECT  = '1201435555554967';
  var SECTIONS = [
    '1201435555556187', // Recently assigned
    '1201435555556192', // Do today
    '1201435555556259', // Do next week
    '1201435555556261'  // Do later
  ];
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // ── Polyfill ───────────────────────────────────────────
  String.prototype.padStart = String.prototype.padStart || function (len, fill) {
    var s = String(this);
    while (s.length < len) s = (fill || ' ') + s;
    return s;
  };

  // ── Helpers ────────────────────────────────────────────
  function getToken() { return localStorage.getItem('asana_pat') || ''; }
  function saveToken(t) { localStorage.setItem('asana_pat', t.trim()); }
  function clearToken() { localStorage.removeItem('asana_pat'); }

  function request(method, path, body) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open(method, API + path, true);
      xhr.setRequestHeader('Authorization', 'Bearer ' + getToken());
      xhr.setRequestHeader('Accept', 'application/json');
      if (body) xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onload = function () {
        try {
          var json = JSON.parse(xhr.responseText);
          if (xhr.status >= 200 && xhr.status < 300) { resolve(json); }
          else { reject(json.errors ? json.errors[0].message : 'HTTP ' + xhr.status); }
        } catch (e) { reject('Parse error'); }
      };
      xhr.onerror = function () { reject('Network error'); };
      xhr.send(body ? JSON.stringify({ data: body }) : null);
    });
  }

  function formatDate(s) {
    var parts = s.split('-');
    return MONTHS[parseInt(parts[1], 10) - 1] + ' ' + parseInt(parts[2], 10);
  }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function dateClass(s) {
    var t = todayStr();
    if (s < t) return 'overdue';
    if (s === t) return 'today';
    return '';
  }

  function addOneDay(s) {
    var p = s.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    d.setDate(d.getDate() + 1);
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  // ── Dark mode ─────────────────────────────────────────
  function isDark() { return localStorage.getItem('dark') === '1'; }
  function applyDark(dark) {
    if (dark) {
      document.body.classList.add('dark');
      document.getElementById('dark-btn').innerHTML = '&#9728;';
    } else {
      document.body.classList.remove('dark');
      document.getElementById('dark-btn').innerHTML = '&#9790;';
    }
  }
  function toggleDark() {
    var next = !isDark();
    localStorage.setItem('dark', next ? '1' : '0');
    applyDark(next);
  }

  // ── Custom order ──────────────────────────────────────
  function getSavedOrder() {
    try { return JSON.parse(localStorage.getItem('task_order') || '[]'); } catch(e) { return []; }
  }

  function saveOrder() {
    var rows = document.querySelectorAll('#task-list .task-row');
    var gids = [];
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].dataset.gid) gids.push(rows[i].dataset.gid);
    }
    localStorage.setItem('task_order', JSON.stringify(gids));
  }

  function applyOrder(tasks) {
    var order = getSavedOrder();
    if (!order.length) return tasks;
    var map = {};
    order.forEach(function (gid, i) { map[gid] = i; });

    // Group by date (tasks already sorted by date)
    var groups = {}, dates = [];
    tasks.forEach(function (t) {
      if (!groups[t.due_on]) { groups[t.due_on] = []; dates.push(t.due_on); }
      groups[t.due_on].push(t);
    });

    // Within each date group apply saved order; unsaved tasks go to end of group
    var result = [];
    dates.forEach(function (date) {
      var g = groups[date];
      var MAX = order.length + g.length;
      g.sort(function (a, b) {
        var ai = map[a.gid] !== undefined ? map[a.gid] : MAX;
        var bi = map[b.gid] !== undefined ? map[b.gid] : MAX;
        if (ai !== bi) return ai - bi;
        return (a._order || 0) - (b._order || 0);
      });
      g.forEach(function (t) { result.push(t); });
    });
    return result;
  }

  // ── Swap animation (FLIP) ────────────────────────────
  function animateSwap(rowA, rowB, doSwap) {
    var topA = rowA.getBoundingClientRect().top;
    var topB = rowB.getBoundingClientRect().top;

    doSwap();

    var deltaA = topA - rowA.getBoundingClientRect().top;
    var deltaB = topB - rowB.getBoundingClientRect().top;

    // Snap back to original positions instantly
    rowA.style.transition = 'none';
    rowB.style.transition = 'none';
    rowA.style.transform = 'translateY(' + deltaA + 'px)';
    rowB.style.transform = 'translateY(' + deltaB + 'px)';

    // Force reflow so the browser registers the starting position
    void rowA.offsetHeight;

    // Animate to final positions using the existing CSS transition
    rowA.style.transition = '';
    rowB.style.transition = '';
    rowA.style.transform = '';
    rowB.style.transform = '';
  }

  // ── Drag and drop ─────────────────────────────────────
  var drag = { active: false, row: null };

  function clearDropIndicators() {
    var rows = document.querySelectorAll('#task-list .task-row');
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.remove('drop-above');
      rows[i].classList.remove('drop-below');
    }
  }

  function rowAtPoint(x, y) {
    // Temporarily hide dragged row so it doesn't block hit-testing
    var src = drag.row;
    var orig = src ? src.style.display : null;
    if (src) src.style.display = 'none';
    var el = document.elementFromPoint(x, y);
    if (src) src.style.display = orig || '';
    if (!el) return null;
    while (el && el.tagName !== 'LI') el = el.parentNode;
    if (!el || !el.classList || !el.classList.contains('task-row')) return null;
    if (el === drag.row) return null;
    return el;
  }

  function dropAt(target, clientY) {
    if (!drag.row || !target) return;
    var rect = target.getBoundingClientRect();
    var before = clientY < rect.top + rect.height / 2;
    var list = drag.row.parentNode;
    if (before) list.insertBefore(drag.row, target);
    else list.insertBefore(drag.row, target.nextSibling);
    saveOrder();
  }

  function addDragHandlers(row, handle) {
    // ── Mouse ──────────────────────────────────────────
    handle.addEventListener('mousedown', function () {
      row.setAttribute('draggable', 'true');
    });
    row.addEventListener('dragstart', function (e) {
      drag.active = true;
      drag.row = row;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', row.dataset.gid);
      setTimeout(function () { row.classList.add('dragging'); }, 0);
    });
    row.addEventListener('dragover', function (e) {
      if (!drag.active || drag.row === row) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      clearDropIndicators();
      var rect = row.getBoundingClientRect();
      row.classList.add(e.clientY < rect.top + rect.height / 2 ? 'drop-above' : 'drop-below');
    });
    row.addEventListener('dragleave', function () {
      row.classList.remove('drop-above', 'drop-below');
    });
    row.addEventListener('drop', function (e) {
      e.preventDefault();
      dropAt(row, e.clientY);
      clearDropIndicators();
    });
    row.addEventListener('dragend', function () {
      row.removeAttribute('draggable');
      row.classList.remove('dragging');
      clearDropIndicators();
      drag.active = false;
      drag.row = null;
    });

    // ── Touch ───────────────────────────────────────────
    var lastTX = 0, lastTY = 0;

    handle.addEventListener('touchstart', function (e) {
      drag.active = true;
      drag.row = row;
      lastTX = e.touches[0].clientX;
      lastTY = e.touches[0].clientY;
      row.classList.add('dragging');
    }, { passive: true });

    handle.addEventListener('touchmove', function (e) {
      if (!drag.active) return;
      e.preventDefault();
      var t = e.touches[0];
      lastTX = t.clientX; lastTY = t.clientY;
      clearDropIndicators();
      var target = rowAtPoint(t.clientX, t.clientY);
      if (target) {
        var rect = target.getBoundingClientRect();
        target.classList.add(t.clientY < rect.top + rect.height / 2 ? 'drop-above' : 'drop-below');
      }
    }, { passive: false });

    handle.addEventListener('touchend', function (e) {
      var t = e.changedTouches[0];
      var target = rowAtPoint(t.clientX, t.clientY);
      if (target) dropAt(target, t.clientY);
      row.classList.remove('dragging');
      clearDropIndicators();
      drag.active = false;
      drag.row = null;
    });
  }

  // ── Data ──────────────────────────────────────────────
  function loadTasks() {
    var fetches = SECTIONS.map(function (gid) {
      return request('GET',
        '/sections/' + gid + '/tasks' +
        '?opt_fields=name,due_on,completed,notes&limit=100'
      ).then(function (res) { return res.data; });
    });
    return Promise.all(fetches).then(function (results) {
      var all = [];
      results.forEach(function (tasks) { tasks.forEach(function (t) { all.push(t); }); });
      var filtered = all
        .filter(function (t) { return !t.completed && t.due_on; })
        .map(function (t, i) { t._order = i; return t; })
        .sort(function (a, b) {
          if (a.due_on < b.due_on) return -1;
          if (a.due_on > b.due_on) return 1;
          return a._order - b._order;
        });
      return applyOrder(filtered);
    });
  }

  function completeTask(gid) { return request('PUT', '/tasks/' + gid, { completed: true }); }

  function snoozeTask(gid, currentDue) {
    var newDue = addOneDay(currentDue);
    return request('PUT', '/tasks/' + gid, { due_on: newDue }).then(function () { return newDue; });
  }

  // ── Render ────────────────────────────────────────────
  function el(tag, cls) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    return e;
  }

  function showState(msg, isError) {
    var list = document.getElementById('task-list');
    list.innerHTML = '<li class="state-msg' + (isError ? ' error' : '') + '">' + msg + '</li>';
  }

  function showLoading() {
    document.getElementById('task-list').innerHTML =
      '<li class="state-msg"><div class="spinner"></div><br>Loading tasks…</li>';
  }

  function fadeOutRow(row) {
    row.classList.add('fading');
    setTimeout(function () { if (row.parentNode) row.parentNode.removeChild(row); }, 550);
  }

  function buildRow(task) {
    var row = el('li', 'task-row');
    row.dataset.gid  = task.gid;
    row.dataset.due  = task.due_on;

    var main = el('div', 'task-row-main');

    // Drag handle (⋮⋮)
    var handle = el('div', 'drag-handle');
    handle.innerHTML = '&#8942;&#8942;';
    handle.title = 'Drag to reorder';

    // Checkbox
    var check = el('div', 'task-check');
    check.setAttribute('role', 'checkbox');
    check.setAttribute('aria-checked', 'false');
    check.setAttribute('tabindex', '0');

    // Name
    var name = el('span', 'task-name');
    name.textContent = task.name;

    // Due date
    var due = el('span', 'task-due ' + dateClass(task.due_on));
    due.textContent = task.due_on === todayStr() ? 'Today' : formatDate(task.due_on);

    // Snooze
    var snooze = el('button', 'btn-snooze');
    snooze.title = 'Push due date forward 1 day';
    snooze.innerHTML = '&#8594;';

    // Up / down buttons
    var btnUp = el('button', 'btn-move');
    btnUp.innerHTML = '&#8593;';
    btnUp.title = 'Move up';
    btnUp.addEventListener('click', function () {
      var prev = row.previousElementSibling;
      while (prev && !prev.classList.contains('task-row')) prev = prev.previousElementSibling;
      if (prev) {
        animateSwap(row, prev, function () { row.parentNode.insertBefore(row, prev); });
        saveOrder();
      }
    });

    var btnDown = el('button', 'btn-move');
    btnDown.innerHTML = '&#8595;';
    btnDown.title = 'Move down';
    btnDown.addEventListener('click', function () {
      var next = row.nextElementSibling;
      while (next && !next.classList.contains('task-row')) next = next.nextElementSibling;
      if (next) {
        animateSwap(row, next, function () { row.parentNode.insertBefore(next, row); });
        saveOrder();
      }
    });

    // Left cell: drag controls + checkbox
    var left = el('div', 'task-left');
    left.appendChild(handle);
    left.appendChild(btnUp);
    left.appendChild(btnDown);
    left.appendChild(check);

    // Right cell: due date + snooze
    var right = el('div', 'task-right');
    right.appendChild(due);
    right.appendChild(snooze);

    main.appendChild(left);
    main.appendChild(name);
    main.appendChild(right);
    row.appendChild(main);

    // Notes panel
    var notes = task.notes && task.notes.trim();
    if (notes) {
      name.style.cursor = 'pointer';
      var panel = el('div', 'task-notes');
      var inner = el('div', 'task-notes-inner');
      inner.textContent = notes;
      panel.appendChild(inner);
      row.appendChild(panel);
      name.addEventListener('click', function () { panel.classList.toggle('open'); });
      inner.addEventListener('click', function () { panel.classList.remove('open'); });
    }

    // Complete
    function doComplete() {
      if (check.classList.contains('checked')) return;
      check.classList.add('checked');
      check.setAttribute('aria-checked', 'true');
      snooze.disabled = true;
      completeTask(task.gid).then(function () {
        fadeOutRow(row);
      }).catch(function (err) {
        check.classList.remove('checked');
        check.setAttribute('aria-checked', 'false');
        snooze.disabled = false;
        alert('Could not complete task: ' + err);
      });
    }
    check.addEventListener('click', doComplete);
    check.addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); doComplete(); }
    });

    // Snooze
    snooze.addEventListener('click', function () {
      snooze.disabled = true;
      snoozeTask(task.gid, row.dataset.due).then(function (newDue) {
        row.dataset.due = newDue;
        due.textContent = newDue === todayStr() ? 'Today' : formatDate(newDue);
        due.className = 'task-due ' + dateClass(newDue);
        repositionRow(row, newDue);
        snooze.disabled = false;
      }).catch(function (err) {
        snooze.disabled = false;
        alert('Could not update due date: ' + err);
      });
    });

    addDragHandlers(row, handle);
    return row;
  }

  function repositionRow(row, newDue) {
    var list = document.getElementById('task-list');
    var rows = list.querySelectorAll('li.task-row');
    var insertBefore = null;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i] !== row && rows[i].dataset.due > newDue) { insertBefore = rows[i]; break; }
    }
    if (insertBefore) list.insertBefore(row, insertBefore);
    else list.appendChild(row);
    saveOrder();
  }

  function renderTasks(tasks) {
    var list = document.getElementById('task-list');
    list.innerHTML = '';
    if (!tasks.length) { showState('All caught up! No tasks with due dates.'); return; }
    var lastDue = null;
    tasks.forEach(function (task) {
      var row = buildRow(task);
      if (lastDue !== null && task.due_on !== lastDue) row.classList.add('new-day');
      lastDue = task.due_on;
      list.appendChild(row);
    });
  }

  // ── App flow ──────────────────────────────────────────
  function showSetup(errMsg) {
    document.getElementById('setup').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    if (errMsg) document.getElementById('setup-error').textContent = errMsg;
  }

  function showApp() {
    document.getElementById('setup').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }

  function fetchAndRender() {
    showLoading();
    loadTasks().then(renderTasks).catch(function (err) {
      if (err && err.indexOf && err.indexOf('401') > -1) {
        clearToken(); showSetup('Token invalid or expired. Please re-enter.'); return;
      }
      showState('Error loading tasks: ' + err, true);
    });
  }

  // ── Boot ──────────────────────────────────────────────
  applyDark(isDark());
  document.getElementById('dark-btn').addEventListener('click', toggleDark);

  document.getElementById('reorder-btn').addEventListener('click', function () {
    var app = document.getElementById('app');
    var active = !app.classList.contains('reorder-mode');
    if (active) { app.classList.add('reorder-mode'); this.classList.add('active'); }
    else { app.classList.remove('reorder-mode'); this.classList.remove('active'); }
  });
  document.getElementById('save-pat-btn').addEventListener('click', function () {
    var val = document.getElementById('pat-input').value.trim();
    if (!val) { document.getElementById('setup-error').textContent = 'Please paste your token.'; return; }
    saveToken(val);
    showApp();
    fetchAndRender();
  });
  document.getElementById('pat-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('save-pat-btn').click();
  });
  document.getElementById('refresh-btn').addEventListener('click', fetchAndRender);
  document.getElementById('signout-btn').addEventListener('click', function () {
    clearToken();
    showSetup('');
    document.getElementById('pat-input').value = '';
    document.getElementById('setup-error').textContent = '';
  });

  if (getToken()) { showApp(); fetchAndRender(); }
  else { showSetup(''); }


})();
</script>
</body>
</html>
